name: Probar generación de tarjetas

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar canvas
        run: npm install canvas

      - name: Generar tarjetas
        run: node generar-tarjetas.js

      - name: Subir imágenes generadas
        uses: actions/upload-artifact@v4
        with:
          name: tarjetas-prueba
          path: src/src/predicciones/output/*.png
