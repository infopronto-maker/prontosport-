name: Test Conexion API Futbol

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ejecutar test
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node generar-radiografia.js
      - name: Guardar datos generados
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/ 2>/dev/null || echo "No hay carpeta data, nada que guardar hoy"
          git commit -m "Datos del dia" || echo "Sin partidos nuevos hoy"
          git push
