name: Generar video diario

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v3

      - name: 🔧 Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 📦 Instalar dependencias
        run: |
          npm install
          npm install --no-save @remotion/cli

      - name: 🔑 Configurar variables de entorno
        run: |
          echo "API_FOOTBALL_KEY=${{ secrets.API_FOOTBALL_KEY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env

      - name: 📝 Generar guion y estadísticas
        run: |
          node generar-guion.js
          node generar-radiografia.js

      - name: 🎬 Renderizar video
        run: node src/render.js

      - name: 📤 Subir video como artefacto
        uses: actions/upload-artifact@v3
        with:
          name: video-prontosport
          path: output/video.mp4
