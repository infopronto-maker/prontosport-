name: Generar video diario

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🔧 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 📦 Instalar dependencias
        run: npm install

      - name: 🔑 Configurar variables de entorno
        run: |
          echo "API_FOOTBALL_KEY=${{ secrets.API_FOOTBALL_KEY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env

      - name: 📝 Generar guion y estadísticas
        run: |
          node generar-guion.js
          node generar-radiografia.js

      - name: 🎬 Renderizar videos (todos los partidos)
        run: node src/render.js

      - name: 📤 Subir todos los videos como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: videos-prontosport
          path: output/*.mp4
