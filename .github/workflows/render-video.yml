name: Generar video diario

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: |
          npm install
          npm install -g hyperframes @supabase/supabase-js

      - name: Configurar variables
        run: |
          echo "API_FOOTBALL_KEY=${{ secrets.API_FOOTBALL_KEY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env

      - name: Generar HTML
        run: node generar-guion.js

      - name: Renderizar y subir a Supabase
        run: node render-hyperframes.js

      - name: Subir artefactos (backup)
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: output/*.mp4
