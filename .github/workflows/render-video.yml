name: Renderizar Video

on:
  workflow_run:
    workflows: ["Test Conexion API Futbol"]
    types:
      - completed
  workflow_dispatch: {}

jobs:
  render:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Verificar si hay datos de partido hoy
        id: check
        run: |
          if [ -f "data/partido-video.json" ]; then
            echo "existe=si" >> "$GITHUB_OUTPUT"
          else
            echo "existe=no" >> "$GITHUB_OUTPUT"
            echo "No hay partido-video.json todavia — no hubo partido prioritario hoy. Nada que renderizar."
          fi

      - name: Configurar Node
        if: steps.check.outputs.existe == 'si'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        if: steps.check.outputs.existe == 'si'
        run: npm install

      - name: Instalar dependencias del sistema (Chrome headless)
        if: steps.check.outputs.existe == 'si'
        run: npx remotion browser ensure

      - name: Renderizar video con datos reales del dia
        if: steps.check.outputs.existe == 'si'
        run: npx remotion render src/index.ts ResumenTactico video-preview.mp4 --props="./data/partido-video.json"

      - name: Subir video como artefacto
        if: steps.check.outputs.existe == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: video-resumen-tactico
          path: video-preview.mp4
          retention-days: 14

      - name: Subir video a Supabase Storage
        if: steps.check.outputs.existe == 'si'
        env:
          SUPABASE_URL: https://bzejstotdvsalpiqywbj.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          FECHA=$(date +%Y-%m-%d)
          NOMBRE_ARCHIVO="resumen-tactico-${FECHA}-${GITHUB_RUN_ID}.mp4"

          RESPUESTA=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "${SUPABASE_URL}/storage/v1/object/pronto-videos/${NOMBRE_ARCHIVO}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: video/mp4" \
            --data-binary "@video-preview.mp4")

          STATUS=$(echo "$RESPUESTA" | grep "HTTP_STATUS" | cut -d: -f2)
          BODY=$(echo "$RESPUESTA" | sed '/HTTP_STATUS/d')

          echo "Respuesta de Supabase: $BODY"
          echo "Codigo HTTP: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "ERROR: la subida a Supabase fallo (codigo $STATUS). Revisar arriba."
            exit 1
          fi

          echo ""
          echo "=== VIDEO DISPONIBLE EN: ==="
          echo "${SUPABASE_URL}/storage/v1/object/public/pronto-videos/${NOMBRE_ARCHIVO}"
