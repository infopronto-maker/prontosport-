
name: Renderizar Video

on:
  workflow_run:
    workflows: ["Test Conexion API Futbol"]
    types:
      - completed
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  render:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Instalar dependencias del sistema (Chrome headless)
        run: npx remotion browser ensure

      - name: Renderizar video
        run: npx remotion render src/index.ts ResumenTactico video-preview.mp4

      - name: Publicar video en GitHub Pages (link directo, siempre la misma URL)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add video-preview.mp4
          git commit -m "Video automático diario" || echo "Sin cambios"
          git push
